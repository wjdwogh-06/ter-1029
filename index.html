<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>초승달섬 전초기지</title>
<link rel="icon" href="data:,">
<style>
:root{--pn:rgba(16,24,36,.84);--bd:rgba(255,255,255,.16);--tx:#F6EEDC;--mut:#A9B6C6;--amb:#FFB547;--grn:#7BD88F;--red:#FF6B5E;--blu:#6CB8FF;--pur:#B79CFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#101820;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--tx);font-weight:700;touch-action:none;overscroll-behavior:none}
#game,#fx{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}#fx{pointer-events:none;z-index:2}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(8,12,24,.4) 100%)}
.ts{position:fixed;left:0;right:0;pointer-events:none;z-index:1;-webkit-backdrop-filter:blur(2.5px);backdrop-filter:blur(2.5px)}
#tsT{top:0;height:22%;-webkit-mask-image:linear-gradient(#000 20%,transparent);mask-image:linear-gradient(#000 20%,transparent)}#tsB{bottom:0;height:16%;-webkit-mask-image:linear-gradient(transparent,#000 80%);mask-image:linear-gradient(transparent,#000 80%)}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,rgba(200,30,30,0) 45%,rgba(200,30,30,.6) 100%);opacity:0;transition:opacity .3s}
#cold{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,rgba(170,215,255,0) 50%,rgba(170,215,255,.55) 100%);opacity:0;transition:opacity 1s}
#ui{position:fixed;left:0;top:0;transform-origin:0 0;z-index:5;pointer-events:none}#ui>*{pointer-events:auto}
.hide{display:none!important}
.pn{position:absolute;background:var(--pn);border:1.5px solid var(--bd);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.bar{height:11px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}.bar i{display:block;height:100%;border-radius:6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35);transition:width .25s}
.br{display:flex;align-items:center;gap:6px;margin-top:6px}.br span{font-size:14px;width:16px;text-align:center;text-shadow:0 2px 3px #000}.br em{font-style:normal;font-size:12px;color:var(--mut);font-weight:600;width:24px}
#st{left:12px;top:10px;width:286px;height:100px;border-radius:52px 18px 18px 52px;pointer-events:none}
#ava{position:absolute;left:8px;top:8px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#7fb0d0,#22364d);border:3px solid var(--amb);overflow:hidden}#ava img{width:84px;height:84px}
#clock{left:50%;top:10px;transform:translateX(-50%);padding:7px 16px;border-radius:24px;display:flex;align-items:center;gap:12px;font-size:15px;white-space:nowrap;pointer-events:none}
#mmw{position:absolute;right:12px;top:10px;width:132px;height:132px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.75);box-shadow:0 8px 20px rgba(0,0,0,.45)}#mm{width:132px;height:132px}
#pills{position:absolute;right:12px;top:150px;display:flex;gap:6px;pointer-events:none}.pill{position:static;display:flex;align-items:center;gap:4px;padding:3px 10px 3px 6px;border-radius:14px;font-size:14px}.pill img{width:22px;height:22px}
#quest{left:12px;top:118px;width:286px;padding:8px 12px;border-radius:14px;pointer-events:none}#quest small{display:block;font-size:11px;color:var(--amb);letter-spacing:.5px}#quest div{font-size:14.5px;margin-top:1px;line-height:1.3}
.rb{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),rgba(20,28,40,.76) 70%);border:2.5px solid rgba(255,255,255,.45);box-shadow:0 8px 18px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;text-shadow:0 2px 3px #000;color:var(--tx);font-family:inherit;font-weight:800;padding:0;touch-action:none}
.rb img{width:62%;height:62%;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}.rb span{font-size:22px;pointer-events:none;line-height:1.1}
#bAtk{right:30px;bottom:26px;width:138px;height:138px;border-color:var(--amb);box-shadow:0 0 0 5px rgba(255,181,71,.22),0 10px 22px rgba(0,0,0,.4)}#bAtk b{position:absolute;bottom:9px;font-size:14px}
#bAtk.bite{border-color:#fff;box-shadow:0 0 0 8px rgba(255,181,71,.6),0 0 30px rgba(255,181,71,.8)}
#bAct{right:182px;bottom:18px;width:98px;height:98px;font-size:17px;opacity:.55}#bAct.on{opacity:1;border-color:var(--grn);box-shadow:0 0 0 5px rgba(123,216,143,.28),0 8px 18px rgba(0,0,0,.35)}
#bRoll{right:178px;bottom:126px;width:74px;height:74px}#bBuild{right:104px;bottom:176px;width:68px;height:68px}#bBag{right:26px;bottom:176px;width:68px;height:68px}
#bMenu{right:154px;top:10px;width:46px;height:46px}#bZoom{right:154px;top:62px;width:46px;height:46px}#bMenu span,#bZoom span{font-size:19px}
#joy{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.2));border:2.5px solid rgba(255,255,255,.5);pointer-events:none}#joy i{position:absolute;left:43px;top:43px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfd8e3);box-shadow:0 6px 14px rgba(0,0,0,.4)}
#quick{left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:7px;padding:7px 9px}
.slot{position:relative;width:62px;height:62px;border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.16);box-shadow:inset 0 -5px 10px rgba(0,0,0,.25);flex:none}
.slot img{position:absolute;left:8%;top:8%;width:84%;height:84%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45));pointer-events:none}.slot b{position:absolute;right:5px;bottom:2px;font-size:14px;font-weight:900;text-shadow:0 2px 3px #000,0 0 6px #000;pointer-events:none}
.slot .key{position:absolute;left:6px;top:3px;font-size:10px;color:var(--mut);pointer-events:none}
.slot.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(255,181,71,.9),0 0 18px rgba(255,181,71,.55),inset 0 -5px 10px rgba(0,0,0,.25);background:linear-gradient(160deg,rgba(255,200,110,.35),rgba(255,255,255,.06))}
#bbar{left:50%;bottom:92px;transform:translateX(-50%);display:flex;gap:8px;padding:8px 10px;align-items:center;font-size:14px;white-space:nowrap}
.btn{background:var(--amb);color:#2a1c08;border:none;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:900;font-family:inherit;box-shadow:0 4px 0 #b97a1f;white-space:nowrap;min-height:44px}.btn:active,.rb:active{transform:translateY(2px)}
.btn.g{background:rgba(255,255,255,.14);color:var(--tx);box-shadow:0 4px 0 rgba(0,0,0,.3)}.btn.r{background:rgba(255,107,94,.25);color:var(--red);box-shadow:0 4px 0 rgba(0,0,0,.3)}.btn[disabled]{opacity:.4}
#toast{left:50%;top:58px;transform:translateX(-50%);padding:8px 16px;font-size:15px;border-radius:14px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}#toast.on{opacity:1}
#ui.port #clock{left:12px;top:184px;transform:none}#ui.port #toast{top:232px}
#ui.port #bAtk{bottom:92px}#ui.port #bAct{bottom:86px}#ui.port #bRoll{bottom:194px}#ui.port #bBuild,#ui.port #bBag{bottom:244px}#ui.port #bbar{bottom:330px}
#shade{position:absolute;left:0;top:0;background:rgba(6,10,18,.6)}
#panel{left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;overflow:hidden;background:rgba(16,24,36,.94)}
#ptop{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1.5px solid var(--bd);font-size:16px}
.tab{padding:10px 16px;border-radius:12px;color:var(--mut);white-space:nowrap}.tab.on{background:var(--amb);color:#2a1c08;box-shadow:0 4px 12px rgba(255,181,71,.4)}
#pclose{width:46px;height:46px;border-radius:50%;background:rgba(255,107,94,.3);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
#pbody{flex:1;overflow-y:auto;padding:12px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.cols{display:flex;gap:14px;min-height:100%}.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,70px);gap:8px;align-content:start}.grid .slot{width:70px;height:70px}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(255,255,255,.07);border-radius:14px;margin-bottom:7px;font-size:15px}.row img{width:46px;height:46px;flex:none}.row .tx{flex:1;min-width:0}.row small{display:block;color:var(--mut);font-size:12.5px;font-weight:500;line-height:1.35}
.cost{display:inline-block;margin-right:8px;font-size:12.5px;font-weight:700}.cost.no{color:var(--red)}.cost.ok{color:var(--grn)}
.sec{font-size:12.5px;color:var(--amb);letter-spacing:.5px;margin:8px 4px 6px}
#title,#load{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
#load{background:#101820;z-index:25;font-size:16px;color:var(--mut)}#load b{font-size:30px;color:var(--tx)}
#title{background:linear-gradient(rgba(10,18,30,.05),rgba(10,18,30,.6))}
#title h1{margin:0;font-size:clamp(30px,9vh,68px);text-shadow:0 4px 0 #1d3a52,0 8px 24px rgba(0,0,0,.5);line-height:1.12}#title p{margin:0 0 8px;font-size:clamp(13px,2.8vh,19px);font-weight:600;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#title .btn{width:min(70vw,270px);padding:12px;font-size:17px}
#fade{position:fixed;inset:0;background:#0b1626;z-index:30;opacity:0;pointer-events:none;transition:opacity .5s;display:flex;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px}#fade.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<canvas id="game"></canvas><canvas id="fx"></canvas>
<div id="vig"></div><div id="tsT" class="ts"></div><div id="tsB" class="ts"></div><div id="hurt"></div><div id="cold"></div>
<div id="ui" class="hide">
 <div id="st" class="pn"><div id="ava"></div><div style="position:absolute;left:102px;top:7px;right:10px"><div style="font-size:15px">생존자 <span id="dayTx" style="color:var(--mut);font-size:12px;font-weight:500"></span></div>
  <div class="br"><span style="color:var(--red)">♥</span><div class="bar" style="flex:1"><i id="bHp" style="background:var(--red)"></i></div><em id="tHp"></em></div>
  <div class="br"><span style="color:var(--amb)">●</span><div class="bar" style="flex:1"><i id="bHu" style="background:var(--amb)"></i></div><em id="tHu"></em></div>
  <div class="br"><span style="color:var(--blu)">❄</span><div class="bar" style="flex:1"><i id="bWa" style="background:var(--blu)"></i></div><em id="tWa"></em></div></div></div>
 <div id="quest" class="pn"></div>
 <div id="clock" class="pn"><span id="clkTx"></span><span id="raidTx" style="color:var(--red);font-size:14px"></span></div>
 <div id="mmw"><canvas id="mm" width="198" height="198"></canvas></div>
 <button id="bMenu" class="rb"><span>⚙</span></button><button id="bZoom" class="rb"><span>🔍</span></button>
 <div id="pills"></div>
 <div id="joy" class="hide"><i></i></div>
 <button id="bAtk" class="rb"><img id="atkIc"><b id="atkN"></b></button>
 <button id="bAct" class="rb">—</button>
 <button id="bRoll" class="rb"><span>💨</span>구르기</button>
 <button id="bBuild" class="rb"><span>🔨</span>건설</button>
 <button id="bBag" class="rb"><span>🎒</span>가방</button>
 <div id="bbar" class="pn hide"></div>
 <div id="quick" class="pn"></div>
 <div id="toast" class="pn"></div>
 <div id="shade" class="hide"></div>
 <div id="panel" class="pn hide"><div id="ptop"><div id="ptabs" style="display:flex;gap:6px"></div><div style="flex:1"></div><span id="pcoin"></span><div id="pclose">✕</div></div><div id="pbody"></div></div>
</div>
<div id="title" class="hide"><h1>초승달섬<br>전초기지</h1><p>숲이 우거진 섬에서 모으고, 만들고, 밤 습격을 막아내세요</p>
 <button class="btn hide" id="tCont">이어하기</button><button class="btn" id="tNew">새로 시작</button><button class="btn g" id="tHelp">조작법</button></div>
<div id="load"><b>초승달섬 전초기지</b><span id="loadTx">불러오는 중…</span></div>
<div id="fade"></div>
<script src="js/three.min.js"></script><script src="js/GLTFLoader.js"></script><script src="js/SkeletonUtils.js"></script>
<script src="js/core.js"></script><script src="js/world.js"></script><script src="js/actors.js"></script><script src="js/water.js"></script><script src="js/ports.js"></script><script src="js/dress.js"></script><script src="js/interior.js"></script><script src="js/look.js"></script><script src="js/ui.js"></script><script src="js/chat.js"></script><script src="js/net.js"></script>
</body>
</html>
